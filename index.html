<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Шахматы — споры на кружку</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #e8e8e8; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .boot { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 16px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="boot" id="boot">Загружаем доску…</div>
  <script>
    (function () {
      var url = 'app.html?v=' + Date.now();
      fetch(url, { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function (error) {
          var boot = document.getElementById('boot');
          if (boot) boot.textContent = 'Не загрузилось: ' + error.message;
        });
    })();
  </script>
</body>
</html>
