<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Шахматы — споры на кружку</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="title">♟ Шахматы <span id="gameId" class="muted"></span></div>
      <div id="status" class="status">Загружаюсь…</div>
    </header>

    <main>
      <div id="board" class="board" aria-label="шахматная доска"></div>

      <div class="panel">
        <div id="players" class="players"></div>
        <div id="moves" class="moves"></div>
        <div class="actions">
          <button id="copyInvite" type="button">Отправить в чат</button>
          <button id="flip" type="button">Перевернуть</button>
          <button id="reset" type="button">Начать заново</button>
        </div>
        <div id="hint" class="hint">
          Тапни фигуру, потом клетку. Играть можно только вдвоём в этом чате.
        </div>
      </div>
    </main>

    <div id="promo" class="promo hidden">
      <div class="promo-box">
        <div>Превращение пешки:</div>
        <div class="promo-buttons">
          <button data-piece="q" type="button">♕</button>
          <button data-piece="r" type="button">♖</button>
          <button data-piece="b" type="button">♗</button>
          <button data-piece="n" type="button">♘</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
